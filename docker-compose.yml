version: '3.7'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Required. There is no default. Set ENCRYPTION_KEY in your shell or a .env file.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - MONGO_URI=mongodb://${MONGO_USER:?MONGO_USER is required}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017
    depends_on:
      - mongo
    restart: on-failure

  mongo:
    image: mongo:7.0
    # No host port mapping. Mongo is only reachable on the internal compose network.
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?MONGO_USER is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
